version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swirl_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/swirl_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-this-in-production"
      JWT_EXPIRES_IN: "7d"
      PORT: "4000"
      MOCK_OTP_CODE: "123456"
      OTP_EXPIRY_MINUTES: "10"
      OTP_MAX_ATTEMPTS: "5"
      AI_SERVICE_URL: "http://host.docker.internal:8000"
      NODE_ENV: "production"
      ALLOWED_ORIGINS: "http://localhost:3000"
      API_PREFIX: "api/v1"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "swirl_user"
      RABBITMQ_PASSWORD: "swirl_password"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - swirl_network

  postgres:
    image: postgres:15
    container_name: swirl_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swirl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - swirl_network

  redis:
    image: redis:7
    container_name: swirl_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - swirl_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: swirl_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: swirl_user
      RABBITMQ_DEFAULT_PASS: swirl_password
    networks:
      - swirl_network

volumes:
  postgres_data:

networks:
  swirl_network:
